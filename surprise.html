<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: Georgia, serif;

            background:
                linear-gradient(
                    rgba(0,0,0,.55),
                    rgba(0,0,0,.55)
                ),
                url("images/rose-bg.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            color: white;

            overflow-x: hidden;

        }


        /* =====================================================
           🎂 BIRTHDAY / LETTER
        ===================================================== */

        .hero {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

        }


        .hero h1 {

            font-size: clamp(
                36px,
                6vw,
                55px
            );

            margin-bottom: 20px;

        }


        .hero h2 {

            margin-top: 30px;

            margin-bottom: 20px;

            font-size: clamp(
                24px,
                4vw,
                32px
            );

        }


        .hero p {

            max-width: 700px;

            font-size: clamp(
                17px,
                3vw,
                20px
            );

            line-height: 1.8;

        }


        /* =====================================================
           📸 PHOTO
        ===================================================== */

        .hero img {

            width: 320px;

            max-width: 90%;

            height: auto;

            margin-top: 30px;

            border-radius: 20px;

            object-fit: cover;

            box-shadow:
                0 0 25px rgba(
                    255,
                    255,
                    255,
                    .9
                );

        }


        /* =====================================================
           🎁 ONE LAST GIFT
        ===================================================== */

        .final {

    min-height: auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px 20px 50px;

}

        .final h1 {

            font-size: clamp(
                38px,
                6vw,
                55px
            );

            margin-bottom: 35px;

        }


        /* =====================================================
           ❤️ OPEN MY HEART
        ===================================================== */

        #giftBtn {

            padding: 16px 32px;

            border: none;

            border-radius: 35px;

            background: white;

            color: #ff4f81;

            font-family: Georgia, serif;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 0 #d8d8d8;

            transition: .25s;

            -webkit-tap-highlight-color:
                transparent;

        }


        #giftBtn:hover {

            transform: translateY(-4px)
                       scale(1.05);

            box-shadow:
                0 8px 0 #d8d8d8;

        }


        #giftBtn:active {

            transform:
                translateY(3px);

            box-shadow:
                0 2px 0 #d8d8d8;

        }


        /* =====================================================
           🎈 BALLOONS
        ===================================================== */

        .balloon {

            position: fixed;

            bottom: -70px;

            font-size: 40px;

            pointer-events: none;

            z-index: 9999;

            animation:
                balloonUp 5s linear forwards;

        }


        @keyframes balloonUp {

            from {

                transform:
                    translateY(0);

                opacity: 1;

            }

            to {

                transform:
                    translateY(
                        -120vh
                    );

                opacity: 0;

            }

        }


        /* =====================================================
           📱 MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                background-attachment:
                    scroll;

            }


            .hero {

                padding:
                    35px 15px;

            }


            .hero h1 {

                font-size: 36px;

            }


            .hero h2 {

                font-size: 24px;

            }


            .hero p {

                font-size: 17px;

                line-height: 1.7;

            }


            .hero img {

                width: 90%;

                max-width: 320px;

            }

.final {

    padding: 15px 15px 40px;

}


            .final h1 {

                font-size: 36px;

                margin-bottom: 30px;

            }


            #giftBtn {

                font-size: 17px;

                padding:
                    14px 27px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         🎂 BIRTHDAY MESSAGE
    ===================================================== -->

    <section class="hero">

        <h1>
            🎉 Happy Birthday Madam ❤️
        </h1>


        <p>
            ✨ Today Is Your Day ✨
        </p>


        <h2>
            💌 A Letter For You
        </h2>


        <p>

            Thank you for being part of my life.

            <br><br>

            Every moment with you is special.

            <br><br>

            Your smile brightens my darkest days.

            <br><br>

            I wish you endless happiness,

            good health and success.

            <br><br>

            Happy Birthday ❤️

        </p>


        <img
            src="images/photo13.jpg"
            alt="Our Memory"
        >

    </section>



    <!-- =====================================================
         🎁 ONE LAST GIFT
    ===================================================== -->

    <section class="final">

        <h1>
            🎁 Gift For You 
        </h1>


        <button id="giftBtn">

            Open My Heart ❤️

        </button>

    </section>



    <!-- =====================================================
         📜 SCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           🎈 BALLOONS
        ===================================================== */

        function createBalloons() {

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                const balloon =
                    document.createElement(
                        "div"
                    );


                balloon.className =
                    "balloon";


                balloon.innerHTML =
                    "🎈";


                balloon.style.left =
                    Math.random() *
                    100 +
                    "vw";


                balloon.style.animationDelay =
                    Math.random() *
                    1.5 +
                    "s";


                document.body.appendChild(
                    balloon
                );


                setTimeout(
                    function () {

                        balloon.remove();

                    },
                    7000
                );

            }

        }



        /* =====================================================
           ❤️ OPEN MY HEART
           → QUESTION.HTML
        ===================================================== */

        const giftBtn =
            document.getElementById(
                "giftBtn"
            );


        giftBtn.addEventListener(
            "click",
            function () {


                createBalloons();


                setTimeout(
                    function () {

                        window.location.href =
                            "question.html";

                    },
                    500
                );

            }
        );


    </script>


</body>

</html>
